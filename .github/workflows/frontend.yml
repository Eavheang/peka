name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "webclient/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  checks:
    name: Webclient checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webclient
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run tsc

      - name: ESLint
        run: bun run lint

      - name: Test
        run: bun run test
