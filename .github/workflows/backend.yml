name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
