# Docker's DNS. `resolve` makes nginx re-look-up the containers, so recreating
# service/webclient on redeploy no longer leaves nginx on their old IPs (502).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream service {
    zone service 64k;
    server service:8000 resolve;
}

upstream webclient {
    zone webclient 64k;
    server webclient:3000 resolve;
}

server {
    listen 80;

    location /api/ {
        # The service enforces 25 MB per file; nginx defaults to 1 MB per request.
        client_max_body_size 100m;
        proxy_pass http://service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://webclient;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
