services:
  webclient:
    image: oven/bun:1
    user: root
    working_dir: /app
    volumes:
      - ../webclient:/app
      - webclient_node_modules:/app/node_modules
    expose:
      - "3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: /api
    command: bun run dev --hostname 0.0.0.0

  proxy:
    image: nginx:alpine
    depends_on:
      - webclient
      - service
    ports:
      - "${WEBCLIENT_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  service:
    build:
      context: ../service
      dockerfile: Dockerfile
    volumes:
      - ../service:/app
      - ../service/storage:/app/storage
    ports:
      - "8000:8000"
    environment:
      APP_NAME: PEKA Service
      DEBUG: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  index-worker:
    volumes:
      - ../service:/app
      - ../service/storage:/app/storage

volumes:
  webclient_node_modules:
