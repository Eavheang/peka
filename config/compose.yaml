services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peka}
      POSTGRES_USER: ${POSTGRES_USER:-peka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peka_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-peka_admin_password}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  webclient:
    build:
      context: ../webclient
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

  service:
    build:
      context: ../service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peka}:${POSTGRES_PASSWORD:-peka_dev_password}@postgres:5432/${POSTGRES_DB:-peka}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - file_storage:/app/storage
    ports:
      - "8000:8000"
    restart: unless-stopped

  okf-worker:
    build:
      context: ../service
      dockerfile: Dockerfile
    command: python -m app.engine.okf.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peka}:${POSTGRES_PASSWORD:-peka_dev_password}@postgres:5432/${POSTGRES_DB:-peka}
      FILE_STORAGE_DIR: /app/storage
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-worker-only-secret-that-is-at-least-32-characters}
      LLM_BASE_URL: http://llama:8080/v1
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in config/.env}
      LLM_MODEL: local
      EMBEDDING_BASE_URL: http://embeddings:80/v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      EMBEDDING_DIMENSIONS: 1024
      EMBEDDING_BATCH_SIZE: 16
    depends_on:
      postgres:
        condition: service_healthy
      llama:
        condition: service_started
      embeddings:
        condition: service_healthy
    volumes:
      - file_storage:/app/storage
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}", "--max-client-batch-size", "16"]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - embedding_models:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10m
    restart: unless-stopped

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    gpus: all
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in config/.env}
    volumes:
      - ./model:/models:ro
      - ./llama/config.yaml:/config/config.yaml:ro
      - ./llama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\r' < /entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh"]
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  file_storage:
  embedding_models:
