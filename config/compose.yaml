services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peka}
      POSTGRES_USER: ${POSTGRES_USER:-peka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peka_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-peka_admin_password}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  webclient:
    build:
      context: ../webclient
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    depends_on:
      - webclient
      - service
    ports:
      - "${WEBCLIENT_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  service:
    build:
      context: ../service
      dockerfile: Dockerfile
    env_file:
      - ../service/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peka}:${POSTGRES_PASSWORD:-peka_dev_password}@postgres:5432/${POSTGRES_DB:-peka}
      EMBEDDING_BASE_URL: http://embeddings:80/v1
      RERANK_BASE_URL: http://reranker:80
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - file_storage:/app/storage
    ports:
      - "8000:8000"
    restart: unless-stopped

  okf-worker:
    build:
      context: ../service
      dockerfile: Dockerfile
    env_file:
      - ../service/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peka}:${POSTGRES_PASSWORD:-peka_dev_password}@postgres:5432/${POSTGRES_DB:-peka}
      FILE_STORAGE_DIR: /app/storage
      EMBEDDING_BASE_URL: http://embeddings:80/v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-1}
    command: ["python", "-m", "app.engine.okf.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    volumes:
      - file_storage:/app/storage
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}", "--max-client-batch-size", "1"]
    volumes:
      - embedding_models:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10m
    restart: unless-stopped

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}"]
    volumes:
      - embedding_models:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10m
    restart: unless-stopped

  llama:
    profiles: ["llama"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    gpus: all
    env_file:
      - ../service/.env
    volumes:
      - ./model:/models:ro
      - ./llama/config.yaml:/config/config.yaml:ro
      - ./llama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\r' < /entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh"]
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  file_storage:
  embedding_models:
