services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peka}
      POSTGRES_USER: ${POSTGRES_USER:-peka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peka_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-peka_admin_password}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  webclient:
    build:
      context: ../webclient
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

  service:
    build:
      context: ../service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peka}:${POSTGRES_PASSWORD:-peka_dev_password}@postgres:5432/${POSTGRES_DB:-peka}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    gpus: all
    environment:
      LLAMA_API_KEY: ${LLAMA_API_KEY:?Set LLAMA_API_KEY in config/.env}
    volumes:
      - ./model:/models:ro
      - ./llama/config.yaml:/config/config.yaml:ro
      - ./llama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
